name: Basic checks
on:
  push:
    branches:
      - '*'
      - '!main'

jobs:
  basic-checks:
    environment: terraform-plan
    env:
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
    permissions:
      contents: read
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
        - name: Get code
          uses: actions/checkout@v7
        # add cache ficherse
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v4
          with:
            terraform_version: 1.12.2
            # Wrapper interferes with -out files and exit codes across steps.
            terraform_wrapper: false

        - name: Terraform fmt
          id: fmt
          run: terraform fmt -check
          continue-on-error: true

        - name: Azure Login
          uses: azure/login@v3
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        - name: Azure CLI script
          uses: azure/cli@v2
          with:
            azcliversion: latest
            inlineScript: |
              az account show

        - name: Terraform Init
          run: |
            terraform init \
              -backend-config="resource_group_name=${{ env.RESOURCE_GROUP }}" \
              -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT }}" \
              -backend-config="container_name=${{ env.CONTAINER_NAME }}" \
              -backend-config="key=terraform.tfstate"

        - name: Terraform Validate
          id: validate
          run: terraform validate -no-color

        - name: Terraform Plan
          id: plan
          run: |
            terraform plan -out=tfplan.binary
            terraform show -no-color tfplan.binary > tfplan.txt
            ls -la tfplan.binary tfplan.txt

        - name: Upload plan artifacts
          uses: actions/upload-artifact@v7
          with:
            name: tfplan-${{ github.job }}-${{ github.run_id }}
            path: |
              tfplan.binary
              tfplan.txt
            if-no-files-found: error
          